<!DOCTYPE html>
<html lang="en" style="font-size: 26px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer{
            height: 500px;
            width: 500px;
            border-style: solid;
            margin: auto;
            background-color: orange;
        }
        #inner{
            height:380px;
            width:380px;
            border-style: solid;
            border-width: 40px;
            margin: 60px;
            padding: 45px;
            box-sizing: border-box;
            background-color: darkgoldenrod;
        }
        #subinner{
            height: 200px;
            width: 200px;
            border-style: solid;
            background-color: wheat;
        }
    </style>
</head>
<body>
    <center><h2>Box Model</h2></center>
    <div id="outer">
        <div id="inner">
            <div id="subinner"></div>
        </div>
    </div>
</body>
</html>
